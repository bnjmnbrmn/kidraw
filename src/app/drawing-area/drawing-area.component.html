<div id="mainDrawingArea" #mainDrawingArea></div>
@if (grow.popup.open) {
  <app-nav-popup [rows]="grow.popup.rows"
                 [left]="grow.popup.left"
                 [top]="grow.popup.top"
                 [dark]="grow.popup.dark"
                 [holdKey]="grow.popup.holdKey"
                 [startFilter]="grow.popup.startFilter"
                 [listKeys]="grow.popup.listKeys"
                 (highlightRow)="grow.onPopupHighlight($event)"
                 (commitRow)="grow.onPopupCommit($event)"
                 (closed)="grow.onPopupClosed()" />
}
