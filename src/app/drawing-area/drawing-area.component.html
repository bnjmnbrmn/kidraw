<div id="mainDrawingArea" #mainDrawingArea></div>
@if (navPopupOpen) {
  <app-nav-popup [rows]="navPopupRows"
                 [class.concealed]="navPopupHidden"
                 [left]="navPopupLeft"
                 [top]="navPopupTop"
                 [dark]="navPopupDark"
                 [holdKey]="navPopupHoldKey"
                 [startFilter]="navPopupStartFilter"
                 (highlightRow)="onNavPopupHighlight($event)"
                 (commitRow)="onNavPopupCommit($event)"
                 (closed)="closeNavPopup()" />
}
