<div class="compact-keymenu" #panelEl
     [class.dark]="dark"
     [class.left]="side === 'left'"
     [style.max-width.px]="maxWidthPx">
  <div class="mode-line" *ngIf="modeName">
    <span class="mode-dot" [style.background]="modeColor"></span>{{ modeName }}
  </div>
  <div class="hint" *ngIf="hint">{{ hint }}</div>
  <div class="rows" #rowsEl>
    <div *ngFor="let row of rows; trackBy: trackRow"
         class="row"
         [class.held]="row.held"
         [class.submenu]="row.isSubmenu"
         [style.padding-left.px]="8 + row.depth * 16">
      <span class="key">{{ row.key }}</span>
      <span class="label">{{ row.label }}</span>
      <span class="release-indicator"
            *ngIf="row.indicator === 'release'"
            aria-label="Runs when the key is released"
            title="Runs on release">
        <span class="release-arrow" aria-hidden="true"></span>
      </span>
      <span class="chevron" *ngIf="row.isSubmenu">{{ row.held ? '▾' : '▸' }}</span>
    </div>
  </div>
</div>
