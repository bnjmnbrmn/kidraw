<div id="keyMenu"></div>

<section class="breadcrumb-bar">
  <span class="breadcrumb-label">Path:</span>
  @if (activeKeyPath.length === 0) {
    <span class="breadcrumb-root">root</span>
  } @else {
    <span class="breadcrumb-root">root</span>
    @for (key of activeKeyPath; track $index) {
      <span class="breadcrumb-separator">&gt;</span>
      <span class="breadcrumb-key">{{ key }}</span>
    }
  }
</section>
