<div id="keyMenu" [class.km-suppressed]="inTextEntryMode"></div>

@if (inTextEntryMode) {
  <div class="km-typing-hint">
    Go ahead and type. Press <kbd>Ctrl-[</kbd> or <kbd>Esc</kbd> to exit.
  </div>
} @else if (vimLabelExitHint) {
  <div class="km-typing-hint km-corner-hint">
    <kbd>Ctrl-[</kbd> or <kbd>Esc</kbd> {{ vimLabelExitHint }}
  </div>
}
