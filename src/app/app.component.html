<app-header (loadSampleGraph)="onLoadSampleGraph($event)"/>

<app-drawing-area [commands]="commandsSubject.asObservable()"
                  (daOut)="handleDANotification($event)"
                  (zoomLevel)="onZoomLevelChange($event)"
                  (movementSpeedChange)="onMovementSpeedChange($event)"
                  (canEditChange)="onCanEditChange($event)"
/>

<app-keymenu
  [movementSpeed]="movementSpeed"
  [canEdit]="canEdit"
  [keyAssignments]="keyAssignments"
  (keyMenuOut)="relayKeymenuCommand($event)"
  (labelEditModeOut)="handleLabelEditModeChange($event)"/>

<app-tuning-panel/>
