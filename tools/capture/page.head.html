<!-- site-head:start -->
<title>KiDraw — Connect your thoughts, at the speed you have them</title>
<meta name="author" content="Benjamin Berman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --ground: #07090c;
    --surface: #12171e;
    --line: #28333f;
    --line-soft: #18212a;
    --ink: #eef3f8;
    --ink-muted: #a5b2c1;
    --ink-faint: #728092;
    --cyan: #47d9e8;
    --amber: #f4da27;
    --grid: rgba(125, 153, 177, .05);
    --grid-strong: rgba(125, 153, 177, .09);
    --radius: 14px;
  }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0 / 140px 140px,
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0 / 140px 140px,
      var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--cyan); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: #8cecf4; }
  :focus-visible { border-radius: 4px; outline: 2px solid var(--cyan); outline-offset: 4px; }
  p { margin: 0; }
  img { height: auto; max-width: 100%; }
  h1, h2 { color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; }
  code {
    background: color-mix(in srgb, var(--amber) 12%, transparent);
    border-radius: 4px;
    color: var(--amber);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: .86em;
    padding: .1em .34em;
  }
  b { color: #fff; }

  .wrap { margin: 0 auto; max-width: 78rem; padding-inline: clamp(1.15rem, 4vw, 2.5rem); }
  .visually-hidden {
    clip: rect(0 0 0 0); clip-path: inset(50%); height: 1px; overflow: hidden;
    position: absolute; white-space: nowrap; width: 1px;
  }

  .skip-link {
    background: var(--amber); color: #171506;
    font-family: "JetBrains Mono", monospace;
    left: 1rem; padding: .5rem .75rem; position: fixed; top: 1rem;
    transform: translateY(-5rem); z-index: 40;
  }
  .skip-link:focus { transform: translateY(0); }

  .masthead {
    align-items: center; display: flex; gap: 1rem;
    justify-content: space-between; padding-block: 1.25rem;
  }
  .wordmark {
    color: var(--ink); font-family: "JetBrains Mono", monospace;
    font-size: 1.12rem; font-weight: 700; letter-spacing: -.04em; text-decoration: none;
  }
  .wordmark span { color: var(--cyan); }
  .nav-link {
    border: 1px solid color-mix(in srgb, var(--amber) 48%, transparent);
    border-radius: 999px; color: var(--amber);
    font: 500 .78rem/1 "JetBrains Mono", monospace;
    padding: .55rem .9rem; text-decoration: none; white-space: nowrap;
  }
  .nav-link:hover { background: color-mix(in srgb, var(--amber) 10%, transparent); color: #fff173; }

  .hero { padding-block: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 4vw, 2.5rem); }
  .wordmark-big {
    font-size: clamp(4rem, 13vw, 9rem); letter-spacing: -.07em;
    line-height: .92; margin: 0;
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: .8rem 1rem; margin-top: 1.6rem; }
  .button {
    border-radius: 999px; display: inline-block;
    font: 600 .92rem/1 "JetBrains Mono", monospace;
    padding: .9rem 1.35rem; text-decoration: none; white-space: nowrap;
  }
  .button-primary { background: var(--amber); border: 1px solid var(--amber); color: #16150a; }
  .button-primary:hover { background: #fff173; }
  .button-ghost { border: 1px solid var(--line); color: var(--ink); }
  .button-ghost:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ---------- the reel ----------
     An act is one window with a strip of panels behind it. The column of
     spacers and the window share a single grid cell: the spacers give the act
     its length, and the window sticks for as long as they last. */
  .act { padding-block: clamp(1rem, 3vh, 2.5rem); }
  .act-inner { display: grid; grid-template-columns: minmax(0, 1fr); }
  .act-scroll, .act-stage { grid-area: 1 / 1; }
  .act-scroll { pointer-events: none; }
  .act-stage { align-self: start; position: sticky; top: 0; z-index: 1; }
  .act-title {
    background: var(--ground);
    font: 700 .95rem/1.3 "JetBrains Mono", monospace;
    letter-spacing: -.03em;
    margin: 0; padding: .55rem clamp(1.15rem, 4vw, 2.5rem) .5rem;
  }
  /* Edge to edge on a phone: the portrait capture is exactly the shape of the
     window, so horizontal padding would crop the keyboard rather than letterbox. */
  .stage-box {
    background: #05070a; border-block: 1px solid var(--line);
    height: 65vh; margin-inline: calc(-1 * clamp(1.15rem, 4vw, 2.5rem));
    overflow: hidden; position: relative;
  }
  .reel { inset: 0; position: absolute; }
  .js .reel { will-change: transform; }
  /* Each panel is one window tall, stacked below the one before it. Moving the
     reel is what puts a caption or an example where the frames just were. */
  .panel { inset: 0; position: absolute; transform: translateY(calc(var(--i) * 100%)); }
  .frame { display: block; inset: 0; opacity: 0; position: absolute; z-index: 0; }
  .frame img { display: block; height: 100%; object-fit: contain; width: 100%; }
  .frame.is-on { opacity: 1; z-index: 2; }
  /* The frame going out stays opaque underneath the one coming in, so a frame
     that has not loaded yet shows the last one rather than the backing. There
     is no cross-fade: the scroll is the playback, and a fade only lags it. */
  .frame.is-under { opacity: 1; z-index: 1; }

  .panel[data-kind="caption"] {
    display: grid; place-items: center;
    padding: clamp(1.5rem, 6vw, 3.5rem);
  }
  .panel-bullets {
    color: var(--ink); font-size: clamp(1.1rem, 3.2vw, 1.7rem);
    line-height: 1.45; list-style: none; margin: 0; max-width: 26ch; padding: 0;
    text-wrap: balance;
  }
  .panel-bullets li { padding-left: 1.1em; position: relative; }
  .panel-bullets li + li { margin-top: .9em; }
  .panel-bullets li::before { color: var(--cyan); content: "\2013"; left: 0; position: absolute; }

  /* A keymenu close-up is a strip eight times wider than it is tall. Fitted to
     the width of a phone its labels are unreadable, so there it is drawn larger
     than the window and the panel pans sideways. */
  @media (max-width: 61.99rem) {
    .panel[data-wide] { overflow-x: auto; overscroll-behavior-x: contain; }
    .panel[data-wide] .frame {
      bottom: auto; right: auto; top: 50%; transform: translateY(-50%);
    }
    .panel[data-wide] .frame img { height: auto; max-width: none; width: 190vw; }
  }

  @media (min-width: 62rem) {
    /* The window is as wide as it can be without growing taller than the
       screen, and the title sits on its left edge rather than the page's. */
    .act-stage { --box: min(52rem, calc((100vh - 9rem) * 820 / 700)); top: max(1rem, calc(50vh - 24rem)); }
    .act-title {
      background: none; margin-inline: auto; max-width: var(--box);
      padding: 0 0 .5rem;
    }
    .stage-box {
      aspect-ratio: 820 / 700; border: 1px solid var(--line);
      border-radius: var(--radius); height: auto;
      margin-inline: auto; max-width: var(--box);
    }
  }

  /* ---------- close ---------- */
  .close { padding-block: clamp(2rem, 6vw, 4rem); }
  .close-actions { display: flex; flex-wrap: wrap; gap: .8rem 1rem; }

  /* ---------- outline ---------- */
  .outline { border-top: 1px solid var(--line-soft); margin-top: clamp(2rem, 5vw, 3.5rem); padding-top: 1.5rem; }
  .outline summary {
    color: var(--ink); cursor: pointer;
    font: 600 .95rem/1.4 "JetBrains Mono", monospace; letter-spacing: -.02em;
  }
  .outline summary::marker { color: var(--cyan); }
  .outline ul { list-style: none; margin: 0; padding-left: 0; }
  .outline > ul { margin-top: 1.3rem; }
  .outline ul ul { border-left: 1px solid var(--line-soft); margin-left: .3rem; padding-left: 1rem; }
  .outline li { color: var(--ink-muted); font-size: .94rem; margin: .28rem 0; }
  .outline > ul > li > span { color: var(--ink); font-family: "JetBrains Mono", monospace; font-weight: 700; }
  .outline li[data-kind="q"] > span { color: var(--ink); font-weight: 600; }
  .outline .outline-note-item { color: var(--ink-faint); font-size: .88rem; list-style: none; }
  .outline .outline-note-item::before { color: var(--ink-faint); content: "– "; }

  footer {
    border-top: 1px solid var(--line-soft); color: var(--ink-faint);
    font-size: .9rem; padding-block: 2.4rem 4rem;
  }
  footer .foot-row { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; justify-content: space-between; }
</style>
