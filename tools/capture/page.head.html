<!-- site-head:start -->
<title>KiDraw — Connect your thoughts, at the speed you have them</title>
<meta name="author" content="Benjamin Berman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --ground: #07090c;
    --surface: #12171e;
    --line: #28333f;
    --line-soft: #18212a;
    --ink: #eef3f8;
    --ink-muted: #a5b2c1;
    --ink-faint: #728092;
    --cyan: #47d9e8;
    --amber: #f4da27;
    --grid: rgba(125, 153, 177, .05);
    --grid-strong: rgba(125, 153, 177, .09);
    --radius: 14px;
  }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0 / 140px 140px,
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0 / 140px 140px,
      var(--ground);
    color: var(--ink);
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--cyan); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: #8cecf4; }
  :focus-visible { border-radius: 4px; outline: 2px solid var(--cyan); outline-offset: 4px; }
  p { margin: 0; }
  img { height: auto; max-width: 100%; }
  h1, h2 { color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; }
  code {
    background: color-mix(in srgb, var(--amber) 12%, transparent);
    border-radius: 4px;
    color: var(--amber);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: .86em;
    padding: .1em .34em;
  }
  b { color: #fff; }

  .wrap { margin: 0 auto; max-width: 78rem; padding-inline: clamp(1.15rem, 4vw, 2.5rem); }
  .visually-hidden {
    clip: rect(0 0 0 0); clip-path: inset(50%); height: 1px; overflow: hidden;
    position: absolute; white-space: nowrap; width: 1px;
  }

  .skip-link {
    background: var(--amber); color: #171506;
    font-family: "JetBrains Mono", monospace;
    left: 1rem; padding: .5rem .75rem; position: fixed; top: 1rem;
    transform: translateY(-5rem); z-index: 40;
  }
  .skip-link:focus { transform: translateY(0); }

  .masthead {
    align-items: center; display: flex; gap: 1rem;
    justify-content: space-between; padding-block: 1.25rem;
  }
  .wordmark {
    color: var(--ink); font-family: "JetBrains Mono", monospace;
    font-size: 1.12rem; font-weight: 700; letter-spacing: -.04em; text-decoration: none;
  }
  .wordmark span { color: var(--cyan); }
  .nav-link {
    border: 1px solid color-mix(in srgb, var(--amber) 48%, transparent);
    border-radius: 999px; color: var(--amber);
    font: 500 .78rem/1 "JetBrains Mono", monospace;
    padding: .55rem .9rem; text-decoration: none; white-space: nowrap;
  }
  .nav-link:hover { background: color-mix(in srgb, var(--amber) 10%, transparent); color: #fff173; }

  .hero { padding-block: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 4vw, 2.5rem); }
  /* The name, then what it is, then what it is for — each a step smaller. */
  .wordmark-big {
    font-size: clamp(4rem, 13vw, 9rem); letter-spacing: -.07em;
    line-height: .92; margin: 0;
  }
  .hero-subtitle {
    color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(1.15rem, 2.8vw, 1.9rem); letter-spacing: -.04em;
    margin-top: .6rem;
  }
  .hero-tagline {
    color: var(--ink-muted); font-size: clamp(.95rem, 1.6vw, 1.15rem);
    margin-top: .5rem;
  }
  .hero-note {
    color: var(--ink-faint); font-size: clamp(.9rem, 1.4vw, 1rem);
    margin-top: 1.1rem; max-width: 34rem;
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: .8rem 1rem; margin-top: 1.6rem; }
  .button {
    border-radius: 999px; display: inline-block;
    font: 600 .92rem/1 "JetBrains Mono", monospace;
    padding: .9rem 1.35rem; text-decoration: none; white-space: nowrap;
  }
  .button-primary { background: var(--amber); border: 1px solid var(--amber); color: #16150a; }
  .button-primary:hover { background: #fff173; }
  .button-ghost { border: 1px solid var(--line); color: var(--ink); }
  .button-ghost:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ---------- the film ----------
     One video per branch of the outline, each under a breadcrumb saying where
     in the diagram it is. The breadcrumb is what used to be a section heading:
     it names the branch and the box being made in it, and it changes as the
     video plays. */
  .act { padding-block: clamp(1.2rem, 4vw, 2.4rem); }
  .film { margin-inline: auto; max-width: 52rem; }
  .crumbs {
    align-items: baseline; display: flex; flex-wrap: wrap; gap: 0 .45rem;
    font: 500 .82rem/1.5 "JetBrains Mono", ui-monospace, monospace;
    /* Reserved, not fitted: the trail changes while the video plays, and a
       breadcrumb that grows a line would push the picture down under it. */
    margin-bottom: .55rem; min-height: 2.6em;
  }
  .crumbs .crumb { color: var(--ink-faint); }
  /* The separator is drawn, not written: every word on this page comes out of
     index.org, and a chevron is not one of its words. */
  .crumbs .crumb + .crumb::before {
    color: var(--line); content: "\203A"; margin-right: .45rem;
  }
  .crumbs .crumb:last-child { color: var(--ink); }
  .film-frame {
    background: #05070a; border: 1px solid var(--line); border-radius: var(--radius);
    line-height: 0; overflow: hidden;
  }
  .film-frame video {
    aspect-ratio: 820 / 700; background: #05070a;
    display: block; height: auto; width: 100%;
  }
  /* The player's own controls are drawn over the bottom of the picture, where
     the app draws its mode chip — and padding does not move them, because
     Chrome lays them over the content box. So with JavaScript they are
     replaced by a bar of our own, underneath the video. Without it the native
     ones stay: covering the mode chip beats having no way to play at all. */
  .film-controls {
    align-items: center; display: flex; gap: .7rem;
    padding: .55rem .1rem 0;
  }
  .film-controls button {
    align-items: center; background: none; border: 1px solid var(--line);
    border-radius: 999px; color: var(--ink); cursor: pointer; display: flex;
    height: 2rem; justify-content: center; padding: 0; width: 2rem;
  }
  .film-controls button:hover { border-color: var(--cyan); color: var(--cyan); }
  .film-play::before {
    border: .45rem solid transparent; border-left-color: currentColor;
    border-right-width: 0; content: ""; margin-left: .18rem;
  }
  .film-controls .is-playing.film-play::before {
    border: 0; border-left: .28rem solid currentColor;
    border-right: .28rem solid currentColor; content: "";
    height: .8rem; margin: 0; width: .72rem;
  }
  .film-seek {
    accent-color: var(--cyan); background: none; flex: 1; height: 1.5rem; min-width: 0;
  }
  .film-time {
    color: var(--ink-faint); font: 500 .78rem/1 "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .film-frame video { cursor: pointer; }
  .film-full::before {
    border: 2px solid currentColor; border-radius: 2px; content: "";
    height: .75rem; width: .95rem;
  }
  /* Edge to edge on a phone: a 820-wide capture inside the page's own padding
     is small enough that the labels stop being readable. */
  @media (max-width: 46rem) {
    .film { margin-inline: calc(-1 * clamp(1.15rem, 4vw, 2.5rem)); }
    .film-frame { border-inline: 0; border-radius: 0; }
    .crumbs {
      font-size: .74rem; min-height: 4.4em;
      padding-inline: clamp(1.15rem, 4vw, 2.5rem);
    }
  }

  /* ---------- close ---------- */
  .close { padding-block: clamp(2rem, 6vw, 4rem); }
  .close-actions { display: flex; flex-wrap: wrap; gap: .8rem 1rem; }

  /* ---------- outline ---------- */
  .outline { border-top: 1px solid var(--line-soft); margin-top: clamp(2rem, 5vw, 3.5rem); padding-top: 1.5rem; }
  .outline summary {
    color: var(--ink); cursor: pointer;
    font: 600 .95rem/1.4 "JetBrains Mono", monospace; letter-spacing: -.02em;
  }
  .outline summary::marker { color: var(--cyan); }
  .outline ul { list-style: none; margin: 0; padding-left: 0; }
  .outline > ul { margin-top: 1.3rem; }
  .outline ul ul { border-left: 1px solid var(--line-soft); margin-left: .3rem; padding-left: 1rem; }
  .outline li { color: var(--ink-muted); font-size: .94rem; margin: .28rem 0; }
  .outline > ul > li > span { color: var(--ink); font-family: "JetBrains Mono", monospace; font-weight: 700; }
  .outline li[data-kind="q"] > span { color: var(--ink); font-weight: 600; }
  .outline .outline-note-item { color: var(--ink-faint); font-size: .88rem; list-style: none; }
  .outline .outline-note-item::before { color: var(--ink-faint); content: "– "; }

  footer {
    border-top: 1px solid var(--line-soft); color: var(--ink-faint);
    font-size: .9rem; padding-block: 2.4rem 4rem;
  }
  footer .foot-row { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; justify-content: space-between; }
</style>
<!-- site-head:end -->
