<script>
(function () {
  'use strict';

  var slice = function (nodes) { return Array.prototype.slice.call(nodes); };
  var acts = slice(document.querySelectorAll('.act'));
  if (!acts.length || !window.requestAnimationFrame) return;
  var root = document.documentElement;

  /** The last part of a panel's window hands the window over to the next one:
   *  the frames slide up and the caption or example rises into their place. */
  var HANDOVER = .18;
  /** How far ahead to ask for frames. They load lazily, and the scroll is the
   *  playback, so a frame that has not arrived stalls the flipbook. */
  var LOOKAHEAD = 40;

  /**
   * One act: the strip of panels, and the column of spacers that scrolls it.
   *
   * A panel's frames are weighted by how long the keystrokes they stand for
   * would take, so a label typed letter by letter takes more of the panel's
   * scroll than the pause after it.
   */
  function collect(act) {
    var reel = act.querySelector('[data-reel]');
    if (!reel) return null;
    var panels = slice(reel.querySelectorAll('.panel')).map(function (element) {
      var frames = slice(element.querySelectorAll('.frame'));
      var cum = [];
      var total = 0;
      frames.forEach(function (frame) {
        cum.push(total);
        total += Math.max(Number(frame.getAttribute('data-ms')) || 0, 120);
      });
      return {
        el: element,
        frames: frames,
        cum: cum,
        total: total || 1,
        shown: element.querySelector('.frame.is-on'),
        warmed: 0
      };
    });
    return {
      el: act,
      reel: reel,
      panels: panels,
      spans: slice(act.querySelectorAll('.act-span')),
      offset: -1
    };
  }

  var stages = acts.map(collect).filter(Boolean);

  /**
   * Put one frame up.
   *
   * Frames are stacked, not cross-faded: the one going out stays opaque
   * underneath, so a frame that has not loaded yet shows the last one rather
   * than the black backing. A fade would only lag the scroll.
   */
  function paint(panel, frame) {
    if (!frame || panel.shown === frame) return;
    var image = frame.querySelector('img');
    // A frame that has not arrived yet is not put up at all. Painting it would
    // lay a transparent picture over the last one and double-expose the two;
    // holding the last one until it lands reads as the flipbook pausing.
    if (image && !image.complete) {
      if (!frame.waitingForImage) {
        frame.waitingForImage = true;
        image.addEventListener('load', schedule);
        image.addEventListener('error', schedule);
      }
      return;
    }
    if (panel.shown) {
      panel.shown.classList.remove('is-on');
      panel.shown.classList.add('is-under');
    }
    frame.classList.remove('is-under');
    frame.classList.add('is-on');
    panel.shown = frame;
  }

  /** Ask for the frames just ahead of the one on screen. */
  function warm(panel, from) {
    if (from + LOOKAHEAD <= panel.warmed) return;
    var end = Math.min(panel.frames.length, from + LOOKAHEAD);
    for (var i = Math.max(0, panel.warmed); i < end; i += 1) {
      var image = panel.frames[i].querySelector('img');
      if (image && image.loading === 'lazy') image.loading = 'eager';
    }
    panel.warmed = end;
  }

  /** The frame this far through a panel's run. */
  function scrub(stage, index, through) {
    var panel = stage.panels[index];
    if (!panel || !panel.frames.length) return;
    var want = panel.total * Math.max(0, Math.min(1, through));
    var at = 0;
    for (var i = 0; i < panel.cum.length; i += 1) {
      if (panel.cum[i] <= want) at = i;
      else break;
    }
    paint(panel, panel.frames[at]);
    warm(panel, at);
  }

  /** Which spacer the reading line is in, and how far through it. */
  function locate(spans, line) {
    var index = 0;
    var at = spans[0].getBoundingClientRect();
    for (var i = 0; i < spans.length; i += 1) {
      var rect = spans[i].getBoundingClientRect();
      if (rect.top <= line) { index = i; at = rect; }
    }
    var through = at.height > 0 ? (line - at.top) / at.height : 0;
    return {index: index, through: Math.max(0, Math.min(1, through))};
  }

  function update() {
    var line = window.innerHeight * .5;
    stages.forEach(function (stage) {
      var rect = stage.el.getBoundingClientRect();
      if (rect.bottom < -240 || rect.top > window.innerHeight + 240) return;
      var found = locate(stage.spans, line);
      var index = Math.min(found.index, stage.panels.length - 1);
      var handover = index < stage.panels.length - 1
        ? Math.max(0, (found.through - (1 - HANDOVER)) / HANDOVER)
        : 0;
      var offset = index + Math.min(1, handover);
      if (offset !== stage.offset) {
        stage.reel.style.transform = 'translateY(' + (-offset * 100) + '%)';
        stage.offset = offset;
      }
      scrub(stage, index, found.through / (1 - HANDOVER));
      if (handover > 0) scrub(stage, index + 1, 0);
    });
  }

  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    window.requestAnimationFrame(function () { queued = false; update(); });
  }

  // A card that is wider than its window starts in the middle of the picture.
  slice(document.querySelectorAll('.panel[data-wide] .card')).forEach(function (panel) {
    var centre = function () { panel.scrollLeft = (panel.scrollWidth - panel.clientWidth) / 2; };
    centre();
    window.addEventListener('resize', centre);
  });

  root.classList.add('js');
  var outline = document.getElementById('outline');
  if (outline) outline.open = false;

  update();
  window.addEventListener('scroll', schedule, {passive: true});
  window.addEventListener('resize', schedule);
})();
</script>
