<script>
(function () {
  'use strict';

  var slice = function (nodes) { return Array.prototype.slice.call(nodes); };
  var videos = slice(document.querySelectorAll('video[data-act]'));
  if (!videos.length) return;
  document.documentElement.classList.add('js');

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /**
   * The breadcrumb.
   *
   * Cues are [{t, trail}] in the video's own seconds, written when the film was
   * cut; the trail stands until the next one, which is why a demo — filmed
   * separately, with no cues of its own — keeps the breadcrumb of the box it
   * belongs to.
   */
  function crumbs(act) {
    var holder = document.querySelector('[data-crumbs="' + act + '"]');
    var source = document.querySelector('script[data-cues="' + act + '"]');
    if (!holder || !source) return null;
    var cues;
    try { cues = JSON.parse(source.textContent); } catch (error) { return null; }
    var showing = -1;
    return function (time) {
      var at = -1;
      for (var i = 0; i < cues.length; i += 1) {
        if (cues[i].t <= time + .001) at = i;
        else break;
      }
      if (at < 0 || at === showing) return;
      showing = at;
      var trail = cues[at].trail;
      var markup = '';
      for (var step = 0; step < trail.length; step += 1) {
        markup += '<span class="crumb">' +
          trail[step].replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</span>';
      }
      holder.innerHTML = markup;
    };
  }

  /**
   * Controls of our own, under the video.
   *
   * The player's own are drawn over the bottom of the picture, which is where
   * the app draws its mode chip — so with JavaScript they are replaced by a
   * bar underneath. Without it the native ones stay: covering the mode chip
   * beats having no way to play at all.
   */
  function controls(video) {
    var frame = video.closest('.film-frame');
    if (!frame) return;
    video.removeAttribute('controls');
    var bar = document.createElement('div');
    bar.className = 'film-controls';

    var play = document.createElement('button');
    play.type = 'button';
    play.className = 'film-play';
    play.setAttribute('aria-label', 'Play');

    var seek = document.createElement('input');
    seek.type = 'range';
    seek.className = 'film-seek';
    seek.min = 0;
    seek.max = 1000;
    seek.value = 0;
    seek.setAttribute('aria-label', 'Seek');

    var full = document.createElement('button');
    full.type = 'button';
    full.className = 'film-full';
    full.setAttribute('aria-label', 'Full screen');

    bar.appendChild(play);
    bar.appendChild(seek);
    bar.appendChild(full);
    frame.parentNode.insertBefore(bar, frame.nextSibling);

    play.addEventListener('click', function () {
      if (video.paused) video.play().catch(function () {});
      else video.pause();
    });
    full.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (frame.requestFullscreen) frame.requestFullscreen();
    });
    var mark = function () {
      var playing = !video.paused && !video.ended;
      play.classList.toggle('is-playing', playing);
      play.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    };
    video.addEventListener('play', mark);
    video.addEventListener('pause', mark);
    video.addEventListener('ended', mark);
    mark();

    // The reader may be dragging the handle; do not fight them for it.
    var scrubbing = false;
    seek.addEventListener('pointerdown', function () { scrubbing = true; });
    seek.addEventListener('pointerup', function () { scrubbing = false; });
    seek.addEventListener('input', function () {
      if (video.duration) video.currentTime = (seek.value / 1000) * video.duration;
    });
    video.addEventListener('timeupdate', function () {
      if (!scrubbing && video.duration) seek.value = (video.currentTime / video.duration) * 1000;
    });
  }

  videos.forEach(function (video) {
    controls(video);
    var update = crumbs(video.getAttribute('data-act'));
    if (update) {
      video.addEventListener('timeupdate', function () { update(video.currentTime); });
      video.addEventListener('seeked', function () { update(video.currentTime); });
    }

    // Someone who pauses a video meant to pause it: scrolling back into it
    // should not start it up again.
    var byHand = false;
    video.addEventListener('pause', function () { if (!video.seeking && !video.ended) byHand = true; });
    video.addEventListener('play', function () { byHand = false; });

    if (still || !('IntersectionObserver' in window)) return;
    // The video is the page's only moving part, and it plays where it is being
    // looked at. Loading waits for that too: only the first act asks for
    // anything before the reader has got to it.
    var watcher = new IntersectionObserver(function (records) {
      records.forEach(function (record) {
        if (record.isIntersecting) {
          if (video.preload === 'none') video.preload = 'auto';
          if (!byHand && video.paused) {
            var started = video.play();
            if (started && started.catch) started.catch(function () {});
          }
        } else if (!video.paused) {
          video.pause();
          byHand = false;
        }
      });
    }, {threshold: .55});
    watcher.observe(video);
  });

  var outline = document.getElementById('outline');
  if (outline) outline.open = false;
})();
</script>
